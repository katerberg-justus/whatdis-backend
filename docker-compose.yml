services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      FLASK_ENV: production
      FLASK_DEBUG: "0"
      REDIS_HOST: redis
      RATELIMIT_STORAGE_URI: redis://redis:6379/1
      PROXY_FIX_X_FOR: "2"
      PROXY_FIX_X_PROTO: "1"
      PROXY_FIX_X_HOST: "1"
      CORS_ORIGINS: https://app.whatdis.nl,https://whatdis.nl
      STATIC_CONTENT_SYNC_ON_START: "1"
    expose:
      - "8000"
    networks:
      - default
      - whatdis-net
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  db:
    image: mariadb:11
    env_file:
      - .env
    environment:
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - mariadb-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redis-data:/data
    restart: unless-stopped

networks:
  whatdis-net:
    external: true

volumes:
  redis-data:
  mariadb-data:
