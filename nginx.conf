# HTTP: ACME challenge + redirect to HTTPS
server {
    listen 80;
    server_name api.whatdis.nl;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS: TLS terminator → gunicorn
server {
    listen 443 ssl;
    server_name api.whatdis.nl;

    ssl_certificate     /etc/letsencrypt/live/api.whatdis.nl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.whatdis.nl/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;

    client_max_body_size 20M;

    location / {
        proxy_pass         http://api:8000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Disable buffering so OpenAI streaming responses flush through immediately
        proxy_buffering    off;
        proxy_read_timeout 300s;
    }
}
